[build-system]
build-backend = "maturin"
requires = ["maturin>=1.9.4,<2.0"]

[project]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
]
dynamic = ["version"]
license = { file = "LICENSE" }
# The wheel statically links every Rust dependency into the extension module, so it
# must carry their license texts alongside LICENSE and NOTICE. This key is what puts
# all three in the wheel: it records them as `License-File:` metadata and stores them
# under `.dist-info/licenses/`, the location PEP 639 defines and license scanners
# look in. THIRD-PARTY-LICENSES is a build output produced by
# `dev/release/dependencies.sh generate-third-party-licenses`, not a source file.
#
# There is deliberately no `[tool.maturin] include` for these. It would be redundant
# -- this key already covers both wheel and sdist -- and maturin would then write
# each file twice, once at the archive root and once under `.dist-info/licenses/`,
# which for a ~400 KB license bundle doubles the payload for nothing.
#
# This key is format-agnostic, so an sdist built in a tree where
# THIRD-PARTY-LICENSES happens to exist will also carry it. Only the wheel jobs
# generate it, so released sdists do not; when it is absent maturin drops both the
# file and its `License-File:` line, which is why it is not excluded here --
# excluding it would declare the metadata and omit the file.
#
# Nothing here fails the build if a file is missing: maturin does not error when a
# `license-files` pattern matches nothing, contrary to what PEP 639 requires of
# consuming tools, and emits no warning either. dev/check_wheel_licenses.py is what
# catches it, by inspecting the built wheel.
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-LICENSES"]
name = "pyiceberg-core"
readme = "project-description.md"
requires-python = ">=3.10,<4"

[tool.maturin]
module-name = "pyiceberg_core.pyiceberg_core_rust"
profile = "release"
python-source = "python"
# Optimize for small binary size (https://github.com/apache/iceberg-rust/pull/1841)
config = [
  "profile.release.lto=\"thin\"",
  "profile.release.codegen-units=1",
  "profile.release.opt-level=\"z\"",
  "profile.release.strip=true",
]

[tool.ruff.lint]
ignore = ["F403", "F405"]

[tool.pytest.ini_options]
filterwarnings = ["error"]

[dependency-groups]
dev = [
  "maturin>=1.9.4,<2.0",
  "pytest>=8.3.2",
  # Set a PyIceberg lower bound; otherwise the resolver may select the
  # unrelated 0.0.2 stub.
  # Install PyArrow directly instead of using pyiceberg[pyarrow]: that extra
  # depends on the published pyiceberg-core, which conflicts with this local build.
  "pyiceberg>=0.11",
  "pyarrow>=17",
  "fastavro>=1.11.1",
]
