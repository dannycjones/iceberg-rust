# cargo-about configuration for THIRD-PARTY-LICENSES, the license-text bundle
# shipped inside the pyiceberg-core wheels. Regenerate with
# `dev/release/dependencies.sh generate-third-party-licenses`.
#
# The wheel is a compiled artifact: every crate below is statically linked into
# pyiceberg_core_rust.abi3.so (.pyd on Windows). Shipping it redistributes those
# crates, which triggers the attribution conditions of their licenses. Those
# conditions require the license text and copyright notices, not just the SPDX
# identifiers that DEPENDENCIES.rust.tsv records.

# No `targets` key on purpose: the target triples are passed on the command line
# instead, as repeated `--target` flags, because the set differs per wheel and one
# report is generated per wheel. The authoritative list is WHEEL_LICENSE_REPORTS
# in dev/release/dependencies.sh; keeping it out of here avoids two lists that
# would have to agree.

# Dev-dependencies never reach the wheel. Build-dependencies can contribute
# generated code to the final binary, so they are deliberately not ignored.
ignore-build-dependencies = false
ignore-dev-dependencies = true

# Superset of the root deny.toml `allow` list, plus the permissive licenses that
# appear in DEPENDENCIES.rust.tsv via cargo-deny exceptions. cargo-about is run
# with `--fail`, so a dependency carrying a license that is not listed here
# breaks the build rather than being silently dropped from the bundle.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
  "0BSD",
  "Unlicense",
  # Category-A: https://issues.apache.org/jira/browse/LEGAL-660
  "Unicode-3.0",
  # Boost Software License Version 1.0 is allowed (Category-A):
  # https://www.apache.org/legal/resolved.html#category-a
  "BSL-1.0",
  # The MPL license is allowed (binary-only):
  # https://www.apache.org/legal/resolved.html#category-b
  "MPL-2.0",
]

# Workspace crates are ASF-owned and already covered by the wheel's LICENSE and
# NOTICE, so they are not repeated in the bundle.
[private]
ignore = true

# zstd-sys declares only "MIT/Apache-2.0", which covers its Rust wrapper and the
# generated bindings. It also vendors the Zstandard C sources under zstd/, and its
# build script compiles them into the extension module, so the wheel redistributes
# Zstandard itself. Zstandard is dual BSD-3-Clause/GPL-2.0; BSD-3-Clause is the
# license taken here, and its Meta copyright notice has to be reproduced. Without
# this clarification cargo-about attributes zstd-sys to Apache-2.0 alone and skips
# zstd/COPYING with "failed to parse license 'GPL-2.0'", dropping the Zstandard
# notice from the bundle.
[zstd-sys.clarify]
license = "Apache-2.0 AND BSD-3-Clause"

[[zstd-sys.clarify.files]]
checksum = "0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594"
license = "Apache-2.0"
path = "LICENSE.Apache-2.0"

[[zstd-sys.clarify.files]]
checksum = "7055266497633c9025b777c78eb7235af13922117480ed5c674677adc381c9d8"
license = "BSD-3-Clause"
path = "zstd/LICENSE"
